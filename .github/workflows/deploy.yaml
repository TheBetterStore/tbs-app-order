name: Deploy

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Environment
        required: true
        type: choice
        options:
          - dev
          - prod
      review_changeset:
        description: Review Changeset
        required: true
        type: boolean
        default: false

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    if: github.actor == 'brycepc'
    environment: ${{ inputs.environment }}
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
      - run: chmod +x ./deploy.sh && ./deploy.sh
        env:
          ENVIRONMENT: ${{ inputs.environment }}
          REVIEW_CHANGESET: ${{ inputs.review_changeset }}
          DEPLOY_BUCKET: ${{ vars.DEPLOY_BUCKET }}
